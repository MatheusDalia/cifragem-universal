[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermeto-cipher-translator"
version = "0.1.0"
description = "Tradutor de Cifras Herméticas para Partitura de Piano"
authors = [
    {name = "Matheus Dalia", email = "matheusdalia@example.com"}
]
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Musicians",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "music21>=9.0.0",
    "matplotlib>=3.5.0",
    "flask>=2.0.0",
    "pandas>=1.3.0",
    "pytest>=7.0.0",
    "opencv-python>=4.5.0",
    "pytesseract>=0.3.8",
    "pillow>=8.0.0",
    "numpy>=1.20.0",
    "scikit-learn>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest-cov",
    "black",
    "flake8",
    "mypy",
]

[project.urls]
"Homepage" = "https://github.com/matheusdalia/hermeto-cipher-translator"
"Bug Reports" = "https://github.com/matheusdalia/hermeto-cipher-translator/issues"

[tool.setuptools]
packages = ["hermeto_cipher_translator"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"