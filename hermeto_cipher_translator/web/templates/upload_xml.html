<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Upload MusicXML - Decifrar Acordes</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .dropzone {
        border: 2px dashed #6c757d;
        border-radius: 10px;
        padding: 30px;
        text-align: center;
        color: #495057;
        cursor: pointer;
        background: #f8f9fa;
      }
    </style>
  </head>
  <body>
    <div class="container mt-4">
      <div class="card">
        <div class="card-body">
          <h4 class="card-title">
            Upload MusicXML (MuseScore - texto de cifras)
          </h4>
          <p class="card-text">
            Arraste um arquivo MusicXML exportado pelo MuseScore. O sistema
            procura por textos de cifra (Ctrl/Cmd+T) e adiciona dois pentagramas
            com as notas decifradas.
          </p>

          <div id="dropzone" class="dropzone">
            <p id="dzText">Clique ou arraste o arquivo aqui</p>
            <input
              id="fileInput"
              type="file"
              accept=".xml,.musicxml"
              style="display: none"
            />
          </div>

          <div class="mt-3 text-center">
            <button id="uploadBtn" class="btn btn-primary">
              Enviar e Gerar MusicXML
            </button>
            <a href="/" class="btn btn-secondary">Voltar</a>
          </div>

          <div id="status" class="mt-3"></div>
        </div>
      </div>
    </div>

    <script>
      const dropzone = document.getElementById("dropzone");
      const fileInput = document.getElementById("fileInput");
      const uploadBtn = document.getElementById("uploadBtn");
      const dzText = document.getElementById("dzText");
      let selectedFile = null;

      dropzone.addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", (e) => {
        selectedFile = e.target.files[0];
        dzText.textContent = selectedFile
          ? selectedFile.name
          : "Clique ou arraste o arquivo aqui";
      });

      dropzone.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropzone.style.background = "#e9ecef";
      });
      dropzone.addEventListener("dragleave", (e) => {
        dropzone.style.background = "#f8f9fa";
      });
      dropzone.addEventListener("drop", (e) => {
        e.preventDefault();
        dropzone.style.background = "#f8f9fa";
        if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
          selectedFile = e.dataTransfer.files[0];
          dzText.textContent = selectedFile.name;
        }
      });

      uploadBtn.addEventListener("click", async () => {
        const status = document.getElementById("status");
        status.innerHTML = "";
        if (!selectedFile) {
          status.innerHTML =
            '<div class="alert alert-warning">Selecione um arquivo MusicXML primeiro.</div>';
          return;
        }

        const formData = new FormData();
        formData.append("file", selectedFile);

        uploadBtn.disabled = true;
        uploadBtn.textContent = "Processando...";

        try {
          const resp = await fetch("/upload_xml", {
            method: "POST",
            body: formData,
          });

          if (!resp.ok) {
            const err = await resp
              .json()
              .catch(() => ({ error: "Erro desconhecido" }));
            status.innerHTML = `<div class="alert alert-danger">Erro: ${
              err.error || JSON.stringify(err)
            }</div>`;
            uploadBtn.disabled = false;
            uploadBtn.textContent = "Enviar e Gerar MusicXML";
            return;
          }

          const blob = await resp.blob();
          const filename =
            resp.headers.get("Content-Disposition")?.split("filename=")[1] ||
            "augmented_music.xml";

          const url = window.URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = filename.replace(/\"|\'/g, "");
          document.body.appendChild(a);
          a.click();
          a.remove();
          window.URL.revokeObjectURL(url);

          status.innerHTML =
            '<div class="alert alert-success">Arquivo gerado e baixado com sucesso.</div>';
        } catch (e) {
          status.innerHTML = `<div class="alert alert-danger">Erro ao enviar arquivo: ${e}</div>`;
        } finally {
          uploadBtn.disabled = false;
          uploadBtn.textContent = "Enviar e Gerar MusicXML";
        }
      });
    </script>
  </body>
</html>
